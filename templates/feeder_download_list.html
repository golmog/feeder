{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('.static', filename='feeder.css') }}">

<form id="form_search" class="form-inline mb-3 justify-content-between">
  <div class="form-inline">
    <select id="status_filter" name="status_filter" class="form-control form-control-sm mr-2">
      <option value="all">전체 상태</option>
      <option value="completed">최종 완료 (Completed)</option>
      <option value="active">진행 중 (Active)</option>
      <option value="move_failed">이동 실패 (Move Failed)</option>
      <option value="failed">최종 실패 (Failed)</option>
      <option value="pending">대기 (Pending)</option>
    </select>
  </div>
  <div class="form-inline">
    <select id="page_size" name="page_size" class="form-control form-control-sm mr-1">
      <option value="15">15개씩</option>
      <option value="25" selected>25개씩</option>
      <option value="50">50개씩</option>
      <option value="100">100개씩</option>
    </select>
    <div class="input-group input-group-sm mr-1">
      <input id="search_word" name="search_word" class="form-control" style="width: 180px;" type="text" placeholder="제목/파일명 검색">
      <div class="input-group-append">
        <button id="search" class="btn btn-primary" type="button">검색</button>
      </div>
    </div>
    <button id="reset_btn" class="btn btn-sm btn-outline-secondary" type="button">리셋</button>
  </div>
</form>

<div id="page1"></div>
<div class="table-responsive">
  <table class="table table-sm table-striped table-hover text-center align-middle">
    <thead class="thead-dark">
      <tr>
        <th style="width: 5%;">ID</th>
        <th style="width: 14%;">상태 / 엔진</th>
        <th style="width: 36%;">피드명 / 콘텐츠 정보</th>
        <th style="width: 15%;">용량 / 저장 경로</th>
        <th style="width: 14%;">완료/수정 시간</th>
        <th style="width: 16%;">제어</th>
      </tr>
    </thead>
    <tbody id="download_list_tbody">
      <tr><td colspan="6" class="py-4 text-muted">다운로드 리스트를 불러오는 중입니다...</td></tr>
    </tbody>
  </table>
</div>
<div id="page2"></div>

<!-- 모달: 다운로드 재시도 설정 모달 -->
<div class="modal fade" id="download_retry_modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-md">
    <div class="modal-content">
      <div class="modal-header d-flex align-items-center justify-content-between">
        <h5 class="modal-title font-weight-bold">
          <i class="fa fa-repeat mr-1 text-warning"></i>다운로드 재시도 설정
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modal_retry_item_id" value="">
        <div class="form-group mb-2">
          <label class="small text-muted font-weight-bold mb-1">대상 콘텐츠</label>
          <div id="modal_retry_item_title" class="p-2 border rounded font-weight-bold small text-light" style="background: rgba(255, 255, 255, 0.05); word-break: break-all;"></div>
        </div>

        <div class="form-group mb-3">
          <label class="small font-weight-bold mb-1">적용할 다운로드 프로필</label>
          <select id="modal_retry_profile_select" class="form-control form-control-sm"></select>
          <small class="form-text text-muted">선택한 프로필의 우선순위 체인과 목적지 경로로 다운로드를 다시 시작합니다.</small>
        </div>

        <div class="card border-0 p-2 small mb-1" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);">
          <div class="mb-1 text-light"><strong>우선순위 체인:</strong> <span id="modal_retry_chain_preview" class="text-warning font-weight-bold ml-1">-</span></div>
          <div class="text-light"><strong>목적지 유형:</strong> <span id="modal_retry_dest_preview" class="text-info font-weight-bold ml-1">-</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn_confirm_retry_execute" class="btn btn-sm btn-warning text-dark font-weight-bold">
          <i class="fa fa-play mr-1"></i>재시도 시작
        </button>
        <button type="button" class="btn btn-sm btn-secondary" data-dismiss="modal">취소</button>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
var package_name = "{{ arg['package_name'] }}";
var sub = "{{ arg['sub'] }}";
</script>
<script src="{{ url_for('.static', filename='feeder_list_base.js') }}"></script>
<script src="{{ url_for('.static', filename='feeder_download_list.js') }}"></script>

{% endblock %}
