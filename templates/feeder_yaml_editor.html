{% if arg['sub'] == 'feed' %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/theme-monokai.min.js"></script>
{% endif %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-yaml.min.js"></script>

<div class="modal fade modal-resizable" id="feeder_yaml_modal" tabindex="-1" role="dialog" aria-labelledby="feeder_yaml_title" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content" style="min-width: 0;">
      <div class="modal-header d-flex align-items-center justify-content-between">
        <h5 id="feeder_yaml_title" class="modal-title">YAML 편집 · feeder_settings.yaml</h5>
        <div class="d-flex align-items-center">
          <button type="button" class="modal-fullscreen-btn mr-2" title="화면 최대화/복원"><i class="fa fa-expand"></i></button>
          <button type="button" class="close" data-dismiss="modal" aria-label="닫기"><span aria-hidden="true">&times;</span></button>
        </div>
      </div>
      <div class="modal-body">
        <div id="feeder_yaml_status" class="small mb-2" role="status" aria-live="polite"></div>
        <div id="feeder_yaml_code" class="feeder-editor-box"></div>
        <textarea id="feeder_yaml_text" class="form-control" aria-label="YAML 원문" spellcheck="false" style="display: none; flex: 1 1 auto; min-height: 300px;"></textarea>
      </div>
      <div class="modal-footer">
        <label class="mr-auto mb-0 small"><input id="feeder_yaml_wrap" type="checkbox" checked> 자동 줄바꿈</label>
        <button id="feeder_yaml_reload" type="button" class="btn btn-sm btn-outline-secondary">다시 불러오기</button>
        <button id="feeder_yaml_save" type="button" class="btn btn-sm btn-primary" disabled>저장</button>
        <button type="button" class="btn btn-sm btn-secondary" data-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('.static', filename='feeder_yaml_editor.js') }}"></script>
